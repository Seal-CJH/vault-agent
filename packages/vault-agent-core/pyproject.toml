[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-agent-core"
version = "0.2.0"
description = "Policy-bound local core for Obsidian knowledge vaults"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"

[project.scripts]
vault-agent = "vault_agent.cli:main"
