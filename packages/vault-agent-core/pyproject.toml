[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vault-agent-core"
version = "0.1.0"
description = "Policy-bound local core for Obsidian knowledge vaults"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
vault-agent = "vault_agent.cli:main"
